            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.txt
          if [ "$HTTP_CODE" != "200" ]; then exit 1; fi
