<svg viewBox="0 0 900 506" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="506" fill="white"/>

  <!-- Slack workspace header -->
  <rect x="0" y="0" width="900" height="48" fill="#1D1D1D"/>
  <text x="16" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">Meefi</text>
  <text x="100" y="30" font-family="system-ui, sans-serif" font-size="13" fill="#999">#soporte-meefi</text>

  <!-- Channel header -->
  <rect x="0" y="48" width="900" height="40" fill="#FAFBFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="16" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A"># soporte-meefi</text>

  <!-- Message group -->
  <g>
    <!-- Avatar circle -->
    <circle cx="24" cy="130" r="18" fill="#6C3BFF"/>
    <text x="18" y="137" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">N</text>

    <!-- Message header: Nelia APP timestamp -->
    <text x="50" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Nelia · APP</text>
    <text x="190" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#999">14:32</text>

    <!-- Message body -->
    <text x="50" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Ticket ID:</text>
    <text x="160" y="135" font-family="system-ui, sans-serif" font-size="13" fill="#1A1A1A">esc_9k2p8f4x</text>

    <text x="50" y="160" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Usuario:</text>
    <text x="160" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#1A1A1A">Maria Fernandez (demo2@meefi.io)</text>

    <text x="50" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Tema:</text>
    <text x="160" y="185" font-family="system-ui, sans-serif" font-size="13" fill="#1A1A1A">recovery_2fa</text>

    <text x="50" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Prioridad:</text>
    <text x="160" y="210" font-family="system-ui, sans-serif" font-size="13" fill="#1A1A1A">media</text>

    <text x="50" y="240" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Resumen:</text>
    <text x="50" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#555" word-spacing="0" line-height="1.4">
      <tspan x="50" dy="0">Usuario reporta perdida del dispositivo con Authenticator.</tspan>
      <tspan x="50" dy="16">Recolecto 4 evidencias completas (INE frente/reverso,</tspan>
      <tspan x="50" dy="16">selfie, ultimos 4 de cuenta).</tspan>
    </text>

    <text x="50" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Hipotesis:</text>
    <text x="50" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#555" word-spacing="0" line-height="1.4">
      <tspan x="70" dy="0">recovery legitimo; usuario responde con datos</tspan>
      <tspan x="70" dy="16">consistentes.</tspan>
    </text>

    <text x="50" y="370" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Proxima accion sugerida:</text>
    <text x="50" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#555" word-spacing="0" line-height="1.4">
      <tspan x="70" dy="0">validar INE vs registro KYC, resetear 2FA,</tspan>
      <tspan x="70" dy="16">notificar por correo.</tspan>
    </text>
  </g>

  <!-- Action buttons -->
  <g>
    <!-- "Tomar caso" button (green outline) -->
    <rect x="50" y="430" width="120" height="36" fill="white" stroke="#2ECC71" stroke-width="2" rx="6"/>
    <text x="110" y="454" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2ECC71" text-anchor="middle">Tomar caso</text>

    <!-- "Ver detalle" button (gray outline) -->
    <rect x="190" y="430" width="120" height="36" fill="white" stroke="#CCCCCC" stroke-width="2" rx="6"/>
    <text x="250" y="454" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#666" text-anchor="middle">Ver detalle</text>
  </g>

  <!-- Thread reply -->
  <g>
    <!-- Avatar circle for Emilio -->
    <circle cx="24" cy="485" r="16" fill="#FF6B6B"/>
    <text x="20" y="491" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">E</text>

    <!-- Thread reply header and content -->
    <text x="50" y="475" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Emilio</text>
    <text x="130" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#999">2 min</text>

    <text x="50" y="495" font-family="system-ui, sans-serif" font-size="13" fill="#1A1A1A">Yo tomo esto, revisando ahora</text>
  </g>
</svg>