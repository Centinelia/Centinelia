<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>

  <!-- Outer shadow -->
  <defs>
    <filter id="shadowFilter">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadowFilter)">
    <!-- Card border -->
    <rect x="20" y="20" width="760" height="560" fill="white" stroke="#E0E0E0" stroke-width="1" rx="8"/>

    <!-- Header -->
    <rect x="20" y="20" width="760" height="60" fill="#0057FF" rx="8" ry="0"/>

    <!-- Header text -->
    <text x="30" y="55" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Meefi Soporte</text>

    <!-- User message bubble -->
    <g>
      <rect x="380" y="110" width="360" height="80" fill="#0057FF" rx="18" ry="18"/>
      <text x="400" y="135" font-family="system-ui, sans-serif" font-size="14" fill="white" word-spacing="0" line-height="1.4">
        <tspan x="400" dy="0">Cuanto tarda una</tspan>
        <tspan x="400" dy="18">transferencia SPEI a otro</tspan>
        <tspan x="400" dy="18">banco?</tspan>
      </text>
    </g>

    <!-- Bot message bubble -->
    <g>
      <rect x="60" y="220" width="380" height="100" fill="#F2F4F7" rx="18" ry="18"/>
      <text x="80" y="245" font-family="system-ui, sans-serif" font-size="14" fill="#1A1A1A" word-spacing="0" line-height="1.4">
        <tspan x="80" dy="0">Puedes revisar nuestro Centro</tspan>
        <tspan x="80" dy="18">de Ayuda para mas informacion:</tspan>
        <tspan x="80" dy="18" fill="#0057FF">https://help.meefi.io</tspan>
      </text>
    </g>

    <!-- Footer input -->
    <rect x="40" y="480" width="720" height="50" fill="#F8F8F8" stroke="#D0D0D0" stroke-width="1" rx="6"/>
    <text x="55" y="512" font-family="system-ui, sans-serif" font-size="14" fill="#999">Escribe tu mensaje</text>

    <!-- Send icon (simple arrow) -->
    <circle cx="755" cy="505" r="12" fill="#0057FF"/>
    <text x="750" y="512" font-family="system-ui, sans-serif" font-size="16" fill="white">⊳</text>
  </g>
</svg>